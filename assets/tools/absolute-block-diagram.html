<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absolute Block Section Diagram — Label It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="tools-common.css">
<style>
  .diagram-scroll{ overflow-x:auto; padding-bottom:8px; }
  .diagram-canvas{
    position:relative;
    width:1180px;
    height:430px;
    margin:0 auto;
    background:var(--bg-card);
    border:1px solid var(--border-hair);
    border-radius:var(--radius-md);
  }
  .divider-line{
    position:absolute;
    top:20px; bottom:20px; left:590px;
    border-left:2px dashed var(--border-hair-strong);
  }
  .baseline{
    position:absolute;
    left:30px; right:30px; top:210px;
    height:3px;
    background:var(--text-hi);
    opacity:0.85;
  }
  .tick{ position:absolute; top:206px; width:2px; height:11px; background:var(--text-mid); }
  .drop-line{ position:absolute; top:0; bottom:0; border-left:1px dashed var(--border-hair-strong); }
  .icon{ position:absolute; display:flex; align-items:center; justify-content:center; }
  .icon-aws{
    width:0; height:0; bottom:14px;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:16px solid var(--accent-orange);
  }
  .icon-flag{ width:20px; height:20px; top:150px; transform:rotate(45deg); border-radius:3px; }
  .icon-flag.yellow{background:var(--accent-amber);}
  .icon-flag.red{background:var(--accent-red);}
  .icon-box{
    top:120px; width:70px; height:44px;
    background:var(--bg-panel);
    border:2px solid var(--text-mid);
    border-radius:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .icon-box .dot{ width:16px; height:16px; border-radius:50%; background:var(--text-hi); }
  .icon-box-label{ position:absolute; top:100px; font-family:var(--mono); font-weight:700; font-size:11px; letter-spacing:0.04em; }
  .blank{
    position:absolute;
    background:var(--bg-panel);
    border:1px solid var(--border-hair-strong);
    border-radius:6px;
    color:var(--text-hi);
    font-family:var(--ui);
    font-weight:600;
    text-align:center;
    padding:4px 2px;
    box-sizing:border-box;
  }
  .blank:focus{outline:none; border-color:var(--accent-purple);}
  .blank.letter{ top:24px; width:26px; height:24px; font-size:12px; font-weight:800; }
  .blank.header{ top:56px; width:96px; height:26px; font-size:11px; letter-spacing:0.03em; text-transform:uppercase; }
  .blank.number{ top:224px; width:80px; height:24px; font-size:11.5px; }
  .blank.arrowlabel{ top:250px; width:120px; height:22px; font-size:10px; letter-spacing:0.02em; text-transform:uppercase; }
  .blank.spanlabel{ top:284px; height:22px; font-size:10.5px; letter-spacing:0.02em; text-transform:uppercase; }
  .blank.abs-label{ top:352px; height:24px; font-size:11px; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; }
  .blank.correct{border-color:var(--accent-green); box-shadow:0 0 0 1px var(--accent-green) inset;}
  .blank.incorrect{border-color:var(--accent-red); box-shadow:0 0 0 1px var(--accent-red) inset;}
  .blank.side-a{color:var(--accent-blue);}
  .blank.side-b{color:var(--accent-orange);}
  .span-arrow{ position:absolute; border-top:2px solid var(--accent-red); opacity:0.85; }
  .span-arrow::before, .span-arrow::after{ content:""; position:absolute; top:-5px; width:2px; height:11px; background:var(--accent-red); }
  .span-arrow::before{ left:0; }
  .span-arrow::after{ right:0; }
  .toolbar{ max-width:1180px; margin:0 auto 18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .toolbar button{
    border:1px solid var(--accent-purple);
    background:var(--accent-purple);
    color:#170022;
    font-family:var(--ui);
    font-weight:700;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .toolbar button.secondary{ background:transparent; color:var(--text-hi); border-color:var(--border-hair-strong); }
  .result-line{ text-align:center; font-family:var(--mono); font-weight:700; font-size:14px; margin:16px 0; min-height:20px; }
  .result-line.ok{color:var(--accent-green);}
  .result-line.partial{color:var(--accent-amber);}
  .hint-note{ text-align:center; color:var(--text-dim); font-family:var(--mono); font-size:11px; max-width:640px; margin:0 auto 22px; }
</style>
</head>
<body class="tools-page">

<div class="fc-header">
  <div class="icon-tile">🚦</div>
  <div>
    <h1>Absolute Block Section Diagram — Label It</h1>
    <p>Fill in every blank: signal names, box labels, distances and the absolute block section itself</p>
  </div>
</div>

<div class="tools-body">
  <p class="hint-note">Type the missing word or number into each box, then check your answers. Distances accept
  either the number alone or with "metres"/"m". Not case sensitive.</p>

  <div class="toolbar">
    <button id="checkBtn">Check answers</button>
    <button class="secondary" id="revealBtn">Reveal all</button>
    <button class="secondary" id="resetBtn">Reset</button>
  </div>

  <div class="result-line" id="resultLine"></div>

  <div class="diagram-scroll">
    <div class="diagram-canvas" id="canvas">
      <div class="divider-line"></div>
      <div class="baseline"></div>
    </div>
  </div>
</div>

<script>
  const AWS_A = 90, DIST_A = 240, HOME_A = 390, SEC_A = 560;
  const AWS_B = 620, DIST_B = 770, HOME_B = 920, SEC_B = 1090;

  const canvas = document.getElementById("canvas");

  function el(tag, className, styleObj){
    const e = document.createElement(tag);
    if(className) e.className = className;
    if(styleObj) Object.assign(e.style, styleObj);
    return e;
  }

  [AWS_A,DIST_A,HOME_A,SEC_A,AWS_B,DIST_B,HOME_B,SEC_B].forEach(x=>{
    canvas.appendChild(el("div","tick",{left:(x-1)+"px"}));
    canvas.appendChild(el("div","drop-line",{left:x+"px", top:"170px", bottom:"210px"}));
  });

  [AWS_A, AWS_B].forEach(x=>{
    canvas.appendChild(el("div","icon icon-aws",{left:(x-9)+"px"}));
  });
  [DIST_A, DIST_B].forEach(x=>{
    canvas.appendChild(el("div","icon icon-flag yellow",{left:(x-10)+"px"}));
  });
  [HOME_A, SEC_A, HOME_B, SEC_B].forEach(x=>{
    canvas.appendChild(el("div","icon icon-flag red",{left:(x-10)+"px"}));
  });

  const BOX_A_X = (HOME_A+SEC_A)/2, BOX_B_X = (HOME_B+SEC_B)/2;
  canvas.appendChild((()=>{ const b=el("div","icon icon-box",{left:(BOX_A_X-35)+"px"}); b.appendChild(el("div","dot")); return b; })());
  canvas.appendChild((()=>{ const b=el("div","icon icon-box",{left:(BOX_B_X-35)+"px"}); b.appendChild(el("div","dot")); return b; })());

  const blanks = [];
  function addBlank(id, cls, x, width, answers, extraClass){
    blanks.push({ id, cls: cls + (extraClass? " "+extraClass:""), x, width, answers });
  }

  [[AWS_A,"A"],[DIST_A,"A"],[HOME_A,"A"],[SEC_A,"A"]].forEach(([x,ans],i)=>{
    addBlank("letter-a-"+i, "blank letter", x, 26, [ans], "side-a");
  });
  [[AWS_B,"B"],[DIST_B,"B"],[HOME_B,"B"],[SEC_B,"B"]].forEach(([x,ans],i)=>{
    addBlank("letter-b-"+i, "blank letter", x, 26, [ans], "side-b");
  });

  [[AWS_A,["AWS"]],[DIST_A,["DISTANT"]],[HOME_A,["HOME"]],[SEC_A,["SECTION"]]].forEach(([x,ans],i)=>{
    addBlank("header-a-"+i, "blank header", x, 96, ans);
  });
  [[AWS_B,["AWS"]],[DIST_B,["DISTANT"]],[HOME_B,["HOME"]],[SEC_B,["SECTION"]]].forEach(([x,ans],i)=>{
    addBlank("header-b-"+i, "blank header", x, 96, ans);
  });

  addBlank("box-a", "blank header", BOX_A_X, 90, ["BOX A"]);
  addBlank("box-b", "blank header", BOX_B_X, 90, ["BOX B"]);

  function acceptDistance(n){ return [String(n), n+"m", n+" m", n+" metres", n+"metres"]; }
  const awsDistMidA = (AWS_A+DIST_A)/2, homeSecMidA = (HOME_A+SEC_A)/2;
  const awsDistMidB = (AWS_B+DIST_B)/2, homeSecMidB = (HOME_B+SEC_B)/2;
  addBlank("num-180-a", "blank number", awsDistMidA, 80, acceptDistance(180));
  addBlank("num-400-a", "blank number", homeSecMidA, 80, acceptDistance(400));
  addBlank("num-180-b", "blank number", awsDistMidB, 80, acceptDistance(180));
  addBlank("num-400-b", "blank number", homeSecMidB, 80, acceptDistance(400));

  addBlank("lbl-awsdist-a", "blank arrowlabel", awsDistMidA, 130, ["AWS TO DISTANT"]);
  addBlank("lbl-clearance-a", "blank arrowlabel", homeSecMidA, 130, ["CLEARANCE POINT"]);
  addBlank("lbl-awsdist-b", "blank arrowlabel", awsDistMidB, 130, ["AWS TO DISTANT"]);
  addBlank("lbl-clearance-b", "blank arrowlabel", homeSecMidB, 130, ["CLEARANCE POINT"]);

  const sbdMidA = (AWS_A+HOME_A)/2, slMidA = (HOME_A+SEC_A)/2;
  const sbdMidB = (AWS_B+HOME_B)/2, slMidB = (HOME_B+SEC_B)/2;
  addBlank("lbl-sbd-a", "blank spanlabel", sbdMidA, 170, ["SERVICE BRAKING DISTANCE"]);
  addBlank("lbl-sl-a", "blank spanlabel", slMidA, 150, ["STATION LIMITS"]);
  addBlank("lbl-sbd-b", "blank spanlabel", sbdMidB, 170, ["SERVICE BRAKING DISTANCE"]);
  addBlank("lbl-sl-b", "blank spanlabel", slMidB, 150, ["STATION LIMITS"]);

  const absMid = (SEC_A+SEC_B)/2;
  addBlank("lbl-abs", "blank abs-label", absMid, 220, ["ABSOLUTE BLOCK SECTION"]);

  function spanArrow(x1, x2, top){
    canvas.appendChild(el("div","span-arrow",{ left:x1+"px", width:(x2-x1)+"px", top:top+"px" }));
  }
  spanArrow(AWS_A, DIST_A, 232);
  spanArrow(HOME_A, SEC_A, 232);
  spanArrow(AWS_B, DIST_B, 232);
  spanArrow(HOME_B, SEC_B, 232);
  spanArrow(AWS_A, HOME_A, 300);
  spanArrow(HOME_A, SEC_A, 300);
  spanArrow(AWS_B, HOME_B, 300);
  spanArrow(HOME_B, SEC_B, 300);
  spanArrow(SEC_A, SEC_B, 368);

  blanks.forEach(b=>{
    const input = document.createElement("input");
    input.type = "text";
    input.className = b.cls;
    input.id = b.id;
    input.style.left = (b.x - b.width/2) + "px";
    input.style.width = b.width + "px";
    input.dataset.answers = JSON.stringify(b.answers);
    input.autocomplete = "off";
    input.spellcheck = false;
    canvas.appendChild(input);
  });

  function normalize(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," "); }
  function isCorrect(input){
    const answers = JSON.parse(input.dataset.answers);
    const val = normalize(input.value);
    return answers.some(a => normalize(a) === val);
  }

  document.getElementById("checkBtn").addEventListener("click", ()=>{
    const inputs = canvas.querySelectorAll("input.blank");
    let correct = 0;
    inputs.forEach(inp=>{
      inp.classList.remove("correct","incorrect");
      if(isCorrect(inp)){ inp.classList.add("correct"); correct++; }
      else{ inp.classList.add("incorrect"); }
    });
    const total = inputs.length;
    const resultEl = document.getElementById("resultLine");
    resultEl.textContent = `${correct} / ${total} correct`;
    resultEl.className = "result-line " + (correct === total ? "ok" : "partial");
  });

  document.getElementById("revealBtn").addEventListener("click", ()=>{
    const inputs = canvas.querySelectorAll("input.blank");
    inputs.forEach(inp=>{
      const answers = JSON.parse(inp.dataset.answers);
      inp.value = answers[0];
      inp.classList.remove("incorrect");
      inp.classList.add("correct");
    });
    document.getElementById("resultLine").textContent = "All answers revealed";
    document.getElementById("resultLine").className = "result-line partial";
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    const inputs = canvas.querySelectorAll("input.blank");
    inputs.forEach(inp=>{
      inp.value = "";
      inp.classList.remove("correct","incorrect");
    });
    document.getElementById("resultLine").textContent = "";
  });
</script>

</body>
</html>
