<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procedure Sequencer — Responding to a Hot Axlebox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="tools-common.css">
</head>
<body class="tools-page">

<div class="ps-header">
  <h1>Procedure Sequencer</h1>
  <p>Drag the steps (or use the arrows) into the correct rule book order, then check.</p>
  <a href="procedure-sequencer.html">← Back to quiz index</a>
</div>

<div class="ps-body">
  <div class="ps-instructions">
    <p class="headline">Put these actions back into the correct order, from the moment you notice the hot axlebox.</p>
    <p class="subline">Drag steps to reorder, or use the ▲▼ arrows.</p>
  </div>

  <div id="stepList"></div>

  <button class="check-order-btn" id="checkOrderBtn">Check order</button>
  <div class="ps-result" id="psResult"></div>
</div>

<script src="procedure-sequencer-engine.js"></script>
<script>
  // Source: GERT8000-TW5 Issue 14, §16.2 "Vehicle developing a hot axlebox"
  // and §16.3c "Delay in carrying out an examination".
  initSequencer({
    storageKey: "ps_hot-axle-boxes",
    steps: [
      { id: 1, text: "Stop the train immediately" },
      { id: 2, text: "Tell the signaller, including whether dangerous goods are involved" },
      { id: 3, text: "If examination hasn't started within 10 minutes, tell the signaller and follow their instructions" },
      { id: 4, text: "If instructed to move, don't exceed 10 mph (15 km/h), or 5 mph (10 km/h) over points/crossings" }
    ]
  });
</script>

</body>
</html>
