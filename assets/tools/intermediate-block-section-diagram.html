<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intermediate Block Section Diagram — Label It</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="tools-common.css">
<style>
  .diagram-scroll{ overflow-x:auto; padding-bottom:8px; }
  .diagram-canvas{
    position:relative;
    width:1740px;
    height:430px;
    margin:0 auto;
    background:#F3EEFA;
    border:1px solid var(--border-hair);
    border-radius:var(--radius-md);
  }
  .diagram-canvas svg{ position:absolute; top:0; left:0; }

  .blank{
    position:absolute;
    background:#FFFFFF;
    border:1.5px solid #C9BEDD;
    border-radius:6px;
    color:#170F21;
    font-family:var(--ui);
    font-weight:600;
    text-align:center;
    padding:3px 2px;
    box-sizing:border-box;
    z-index:2;
  }
  .blank:focus{outline:none; border-color:var(--accent-purple); box-shadow:0 0 0 2px rgba(199,125,255,0.25);}
  .blank.letter{ top:14px; width:26px; height:24px; font-size:12px; font-weight:800; }
  .blank.header{ top:46px; width:96px; height:26px; font-size:11px; letter-spacing:0.03em; text-transform:uppercase; }
  .blank.header-wide{ top:40px; width:180px; height:38px; font-size:9.5px; letter-spacing:0.02em; text-transform:uppercase; line-height:1.15; }
  .blank.subheader{ top:80px; width:150px; height:20px; font-size:8.5px; letter-spacing:0.02em; text-transform:uppercase; font-weight:500; }
  .blank.number{ top:224px; width:82px; height:24px; font-size:11.5px; }
  .blank.arrowlabel{ top:250px; width:130px; height:22px; font-size:9.5px; letter-spacing:0.02em; text-transform:uppercase; }
  .blank.spanlabel{ top:286px; height:22px; font-size:10.5px; letter-spacing:0.02em; text-transform:uppercase; }
  .blank.abs-label{ top:354px; height:24px; font-size:10.5px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase; }
  .blank.correct{border-color:var(--accent-green); background:#EAFBF5; box-shadow:0 0 0 1px var(--accent-green) inset;}
  .blank.incorrect{border-color:var(--accent-red); background:#FFEEF3; box-shadow:0 0 0 1px var(--accent-red) inset;}
  .blank.side-a{color:#2C6FA8;}
  .blank.side-b{color:#C05A1F;}

  .toolbar{ max-width:1740px; margin:0 auto 18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .toolbar button{
    border:1px solid var(--accent-purple);
    background:var(--accent-purple);
    color:#170022;
    font-family:var(--ui);
    font-weight:700;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:var(--radius-sm);
    cursor:pointer;
  }
  .toolbar button.secondary{ background:transparent; color:var(--text-hi); border-color:var(--border-hair-strong); }
  .result-line{ text-align:center; font-family:var(--mono); font-weight:700; font-size:14px; margin:16px 0; min-height:20px; }
  .result-line.ok{color:var(--accent-green);}
  .result-line.partial{color:var(--accent-amber);}
  .hint-note{ text-align:center; color:var(--text-dim); font-family:var(--mono); font-size:11px; max-width:640px; margin:0 auto 22px; }
</style>
</head>
<body class="tools-page">

<div class="fc-header">
  <div class="icon-tile">🚦</div>
  <div>
    <h1>Intermediate Block Section Diagram — Label It</h1>
    <p>Box A → Intermediate Block signals → Box B, with the intermediate and absolute block sections</p>
  </div>
</div>

<div class="tools-body">
  <p class="hint-note">Type the missing word or number into each box, then check your answers. Distances accept
  either the number alone or with "metres"/"m". Not case sensitive.</p>

  <div class="toolbar">
    <button id="checkBtn">Check answers</button>
    <button class="secondary" id="revealBtn">Reveal all</button>
    <button class="secondary" id="resetBtn">Reset</button>
  </div>

  <div class="result-line" id="resultLine"></div>

  <div class="diagram-scroll">
    <div class="diagram-canvas" id="canvas">
      <svg id="svgLayer" width="1740" height="430" viewBox="0 0 1740 430"></svg>
    </div>
  </div>
</div>

<script>
  // ---- Column positions ----
  const AWS_A = 90, DIST_A = 240, HOME_A = 390, SEC_A = 560;
  const DIVIDER1 = 610;
  const AWS_IB = 660, IBDIST_X = 870, IBHOME_X = 1080;
  const DIVIDER2 = 1130;
  const AWS_B = 1180, DIST_B = 1330, HOME_B = 1480, SEC_B = 1650;
  const BASE_Y = 210;
  const BOX_A_X = (HOME_A+SEC_A)/2, BOX_B_X = (HOME_B+SEC_B)/2;

  const SVG_NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("svgLayer");
  const canvas = document.getElementById("canvas");

  function svgEl(tag, attrs){
    const e = document.createElementNS(SVG_NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  const defs = svgEl("defs");
  const marker = svgEl("marker", { id:"arrowRed", markerWidth:8, markerHeight:8, refX:4, refY:4, orient:"auto" });
  marker.appendChild(svgEl("path", { d:"M0,0 L8,4 L0,8 Z", fill:"#FF5D8F" }));
  defs.appendChild(marker);
  svg.appendChild(defs);

  // ---- Baseline + dividers ----
  svg.appendChild(svgEl("line", { x1:20, y1:BASE_Y, x2:1720, y2:BASE_Y, stroke:"#3B2E4D", "stroke-width":3, opacity:0.9 }));
  [DIVIDER1, DIVIDER2].forEach(dx=>{
    svg.appendChild(svgEl("line", { x1:dx, y1:20, x2:dx, y2:400, stroke:"#8A7AA3", "stroke-width":2, "stroke-dasharray":"6,6" }));
  });

  const allColumns = [AWS_A,DIST_A,HOME_A,SEC_A,AWS_IB,IBDIST_X,IBHOME_X,AWS_B,DIST_B,HOME_B,SEC_B];
  allColumns.forEach(x=>{
    svg.appendChild(svgEl("line", { x1:x, y1:170, x2:x, y2:BASE_Y, stroke:"#B7A9C4", "stroke-width":1, "stroke-dasharray":"3,4" }));
    svg.appendChild(svgEl("line", { x1:x, y1:BASE_Y-6, x2:x, y2:BASE_Y+6, stroke:"#3B2E4D", "stroke-width":2 }));
  });

  // ---- AWS marker ----
  function drawAWS(x){
    const pts = `${x-9},${BASE_Y} ${x+9},${BASE_Y} ${x},${BASE_Y-17}`;
    svg.appendChild(svgEl("polygon", { points:pts, fill:"#FF8A50" }));
  }
  [AWS_A, AWS_IB, AWS_B].forEach(drawAWS);

  // ---- Semaphore-style signal: post + angled fishtail arm + base dot ----
  function drawSignal(x, color){
    const postTop = BASE_Y - 62;
    svg.appendChild(svgEl("line", { x1:x, y1:BASE_Y, x2:x, y2:postTop, stroke:"#4A3F5C", "stroke-width":3 }));
    const armY = postTop + 10;
    const armLen = 34;
    const armPts = [
      [x, armY-5],[x+armLen, armY-5],[x+armLen-7, armY],[x+armLen, armY+5],[x, armY+5],
    ].map(p=>p.join(",")).join(" ");
    svg.appendChild(svgEl("polygon", { points:armPts, fill:color, stroke:"#0A0710", "stroke-width":1 }));
    svg.appendChild(svgEl("rect", { x:x+armLen-16, y:armY-5, width:5, height:10, fill:"#0A0710" }));
    svg.appendChild(svgEl("circle", { cx:x, cy:BASE_Y, r:4, fill:"#3ED6A0" }));
  }
  [DIST_A, IBDIST_X, DIST_B].forEach(x=>drawSignal(x, "#FFB454"));
  [HOME_A, SEC_A, HOME_B, SEC_B].forEach(x=>drawSignal(x, "#FF5D8F"));

  // ---- Intermediate Block home signal: distinct track-circuited marker ----
  function drawIBHome(x){
    const postTop = BASE_Y - 62;
    svg.appendChild(svgEl("line", { x1:x, y1:BASE_Y, x2:x, y2:postTop, stroke:"#4A3F5C", "stroke-width":3 }));
    // small horizontal cross-arm
    svg.appendChild(svgEl("line", { x1:x-10, y1:postTop+8, x2:x+10, y2:postTop+8, stroke:"#3B2E4D", "stroke-width":2 }));
    // hourglass/diamond marker representing the track-circuited position-light unit
    const midY = postTop + 26;
    svg.appendChild(svgEl("polygon", {
      points:`${x-10},${midY-12} ${x+10},${midY-12} ${x},${midY} ${x-10},${midY+12} ${x+10},${midY+12} ${x},${midY}`,
      fill:"#FFFFFF", stroke:"#0A0710", "stroke-width":1.5
    }));
    svg.appendChild(svgEl("circle", { cx:x, cy:BASE_Y, r:4, fill:"#3ED6A0" }));
  }
  drawIBHome(IBHOME_X);

  // ---- Signal box: cabin + lever dot ----
  function drawBox(x){
    svg.appendChild(svgEl("rect", { x:x-35, y:120, width:70, height:44, rx:6, fill:"#120B1A", stroke:"#4A3F5C", "stroke-width":2 }));
    svg.appendChild(svgEl("circle", { cx:x, cy:142, r:8, fill:"#F5EFFA" }));
    svg.appendChild(svgEl("line", { x1:x-40, y1:164, x2:x+40, y2:164, stroke:"#4A3F5C", "stroke-width":2 }));
  }
  [BOX_A_X, BOX_B_X].forEach(drawBox);

  // ---- Double-headed distance/span arrows ----
  function spanArrowLine(x1, x2, y){
    const line = svgEl("line", { x1, y1:y, x2, y2:y, stroke:"#FF5D8F", "stroke-width":2 });
    line.setAttribute("marker-start","url(#arrowRed)");
    line.setAttribute("marker-end","url(#arrowRed)");
    svg.appendChild(line);
  }
  // Zone 1
  spanArrowLine(AWS_A, DIST_A, 234);
  spanArrowLine(HOME_A, SEC_A, 234);
  spanArrowLine(AWS_A, HOME_A, 302);
  spanArrowLine(HOME_A, SEC_A, 302);
  // Zone 2 (Intermediate Block)
  spanArrowLine(AWS_IB, IBDIST_X, 234);
  spanArrowLine(AWS_IB, IBHOME_X, 302);
  // Zone 3
  spanArrowLine(AWS_B, DIST_B, 234);
  spanArrowLine(HOME_B, SEC_B, 234);
  spanArrowLine(AWS_B, HOME_B, 302);
  spanArrowLine(HOME_B, SEC_B, 302);
  // Bottom: intermediate block section + absolute block section
  spanArrowLine(SEC_A, IBHOME_X, 370);
  spanArrowLine(IBHOME_X, SEC_B, 370);

  // ================= Blank inputs =================
  const blanks = [];
  function addBlank(id, cls, x, width, answers, extraClass){
    blanks.push({ id, cls: cls + (extraClass? " "+extraClass:""), x, width, answers });
  }
  function acceptDistance(n){ return [String(n), n+"m", n+" m", n+" metres", n+"metres"]; }

  // ---- Zone 1 (Box A) ----
  [[AWS_A,"A"],[DIST_A,"A"],[HOME_A,"A"],[SEC_A,"A"]].forEach(([x,ans],i)=>{
    addBlank("letter-a1-"+i, "blank letter", x, 26, [ans], "side-a");
  });
  [[AWS_A,["AWS"]],[DIST_A,["DISTANT"]],[HOME_A,["HOME"]],[SEC_A,["SECTION"]]].forEach(([x,ans],i)=>{
    addBlank("header-a1-"+i, "blank header", x, 96, ans);
  });
  addBlank("box-a1", "blank header", BOX_A_X, 90, ["BOX A"]);
  const awsDistMidA1 = (AWS_A+DIST_A)/2, homeSecMidA1 = (HOME_A+SEC_A)/2, sbdMidA1 = (AWS_A+HOME_A)/2;
  addBlank("num-180-a1", "blank number", awsDistMidA1, 82, acceptDistance(180));
  addBlank("num-400-a1", "blank number", homeSecMidA1, 82, acceptDistance(400));
  addBlank("lbl-awsdist-a1", "blank arrowlabel", awsDistMidA1, 135, ["AWS TO DISTANT"]);
  addBlank("lbl-clearance-a1", "blank arrowlabel", homeSecMidA1, 135, ["CLEARANCE POINT"]);
  addBlank("lbl-sbd-a1", "blank spanlabel", sbdMidA1, 175, ["SERVICE BRAKING DISTANCE"]);
  addBlank("lbl-sl-a1", "blank spanlabel", homeSecMidA1, 150, ["STATION LIMITS"]);

  // ---- Zone 2 (Intermediate Block, still "A" side) ----
  [[AWS_IB,"A"],[IBDIST_X,"A"],[IBHOME_X,"A"]].forEach(([x,ans],i)=>{
    addBlank("letter-ib-"+i, "blank letter", x, 26, [ans], "side-a");
  });
  addBlank("header-ib-0", "blank header", AWS_IB, 96, ["AWS"]);
  addBlank("header-ib-1", "blank header-wide", IBDIST_X, 180, ["INTERMEDIATE BLOCK DISTANT SIGNAL"]);
  addBlank("header-ib-2", "blank header-wide", IBHOME_X, 180, ["INTERMEDIATE BLOCK HOME SIGNAL"]);
  addBlank("subheader-ib", "blank subheader", IBHOME_X, 150, ["TRACK CIRCUITED", "(TRACK CIRCUITED)"]);
  const awsDistMidIB = (AWS_IB+IBDIST_X)/2, sbdMidIB = (AWS_IB+IBHOME_X)/2;
  addBlank("num-180-ib", "blank number", awsDistMidIB, 82, acceptDistance(180));
  addBlank("lbl-awsdist-ib", "blank arrowlabel", awsDistMidIB, 135, ["AWS TO DISTANT"]);
  addBlank("lbl-sbd-ib", "blank spanlabel", sbdMidIB, 175, ["SERVICE BRAKING DISTANCE"]);

  // ---- Zone 3 (Box B) ----
  [[AWS_B,"B"],[DIST_B,"B"],[HOME_B,"B"],[SEC_B,"B"]].forEach(([x,ans],i)=>{
    addBlank("letter-b1-"+i, "blank letter", x, 26, [ans], "side-b");
  });
  [[AWS_B,["AWS"]],[DIST_B,["DISTANT"]],[HOME_B,["HOME"]],[SEC_B,["SECTION"]]].forEach(([x,ans],i)=>{
    addBlank("header-b1-"+i, "blank header", x, 96, ans);
  });
  addBlank("box-b1", "blank header", BOX_B_X, 90, ["BOX B"]);
  const awsDistMidB1 = (AWS_B+DIST_B)/2, homeSecMidB1 = (HOME_B+SEC_B)/2, sbdMidB1 = (AWS_B+HOME_B)/2;
  addBlank("num-180-b1", "blank number", awsDistMidB1, 82, acceptDistance(180));
  addBlank("num-400-b1", "blank number", homeSecMidB1, 82, acceptDistance(400));
  addBlank("lbl-awsdist-b1", "blank arrowlabel", awsDistMidB1, 135, ["AWS TO DISTANT"]);
  addBlank("lbl-clearance-b1", "blank arrowlabel", homeSecMidB1, 135, ["CLEARANCE POINT"]);
  addBlank("lbl-sbd-b1", "blank spanlabel", sbdMidB1, 175, ["SERVICE BRAKING DISTANCE"]);
  addBlank("lbl-sl-b1", "blank spanlabel", homeSecMidB1, 150, ["STATION LIMITS"]);

  // ---- Bottom: Intermediate Block Section + Absolute Block Section ----
  const ibsMid = (SEC_A+IBHOME_X)/2, absMid = (IBHOME_X+SEC_B)/2;
  addBlank("lbl-ibs", "blank abs-label", ibsMid, 210, ["INTERMEDIATE BLOCK SECTION"]);
  addBlank("lbl-abs", "blank abs-label", absMid, 200, ["ABSOLUTE BLOCK SECTION"]);

  blanks.forEach(b=>{
    const input = document.createElement("input");
    input.type = "text";
    input.className = b.cls;
    input.id = b.id;
    input.style.left = (b.x - b.width/2) + "px";
    input.style.width = b.width + "px";
    input.dataset.answers = JSON.stringify(b.answers);
    input.autocomplete = "off";
    input.spellcheck = false;
    canvas.appendChild(input);
  });

  function normalize(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," "); }
  function isCorrect(input){
    const answers = JSON.parse(input.dataset.answers);
    const val = normalize(input.value);
    return answers.some(a => normalize(a) === val);
  }

  document.getElementById("checkBtn").addEventListener("click", ()=>{
    const inputs = canvas.querySelectorAll("input.blank");
    let correct = 0;
    inputs.forEach(inp=>{
      inp.classList.remove("correct","incorrect");
      if(isCorrect(inp)){ inp.classList.add("correct"); correct++; }
      else{ inp.classList.add("incorrect"); }
    });
    const total = inputs.length;
    const resultEl = document.getElementById("resultLine");
    resultEl.textContent = `${correct} / ${total} correct`;
    resultEl.className = "result-line " + (correct === total ? "ok" : "partial");
  });

  document.getElementById("revealBtn").addEventListener("click", ()=>{
    const inputs = canvas.querySelectorAll("input.blank");
    inputs.forEach(inp=>{
      const answers = JSON.parse(inp.dataset.answers);
      inp.value = answers[0];
      inp.classList.remove("incorrect");
      inp.classList.add("correct");
    });
    document.getElementById("resultLine").textContent = "All answers revealed";
    document.getElementById("resultLine").className = "result-line partial";
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    const inputs = canvas.querySelectorAll("input.blank");
    inputs.forEach(inp=>{
      inp.value = "";
      inp.classList.remove("correct","incorrect");
    });
    document.getElementById("resultLine").textContent = "";
  });
</script>

</body>
</html>
