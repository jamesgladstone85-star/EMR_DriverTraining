<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module — Driver Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{background:var(--bg-void);}
  .module-progress{max-width:1180px;margin:18px auto 0;padding:0 28px;}
  .module-progress-head{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-bottom:8px;
  }
  .module-progress-head b{color:var(--text-hi);font-size:12.5px;}
  .module-progress-track{
    width:100%;height:8px;border-radius:6px;background:var(--bg-card);
    border:1px solid var(--border-hair);overflow:hidden;
  }
  .module-progress-fill{
    height:100%;background:linear-gradient(90deg, var(--accent-purple), var(--accent-purple-dim));
    transition:width .4s ease;
  }
</style>
</head>
<body>

<div class="module-header">
  <div class="left">
    <a class="btn btn-outline-white" href="index.html">← Back</a>
    <div class="title-block">
      <span class="badge-pill" id="badgePill">MODULE</span>
      <h1 id="pageTitle">Loading…</h1>
    </div>
  </div>
  <button class="btn btn-outline-white" id="markDoneBtn">Mark as done</button>
</div>
<div class="rail-strip"></div>

<div class="module-progress" id="moduleProgressBlock" style="display:none;">
  <div class="module-progress-head">
    <span id="moduleProgressLabel">Module progress</span>
    <b id="moduleProgressPct">0%</b>
  </div>
  <div class="module-progress-track"><div class="module-progress-fill" id="moduleProgressFill" style="width:0%;"></div></div>
</div>

<div class="page-body">

  <div class="content-section" id="guidesSection">
    <div class="section-title guides"><span class="dot">📄</span> Revision Guides</div>
    <div class="card-grid" id="guidesGrid"></div>
  </div>

  <div class="content-section" id="quizzesSection">
    <div class="section-title quizzes"><span class="dot">✏️</span> Quizzes</div>
    <div class="card-grid" id="quizzesGrid"></div>
  </div>

  <div class="content-section" id="toolsSection" style="display:none;">
    <div class="section-title tools"><span class="dot">🔧</span> Tools</div>
    <div class="card-grid" id="toolsGrid"></div>
  </div>

</div>

<div class="footer-note">All content sourced from your rule book material</div>

<script src="assets/data.js"></script>
<script src="assets/team.js"></script>
<script src="assets/identity.js"></script>
<script src="assets/progress.js"></script>
<script>
  function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  function toast(msg){
    let el = document.getElementById("toastEl");
    if(!el){
      el = document.createElement("div");
      el.id = "toastEl";
      Object.assign(el.style, {
        position:"fixed", bottom:"24px", left:"50%", transform:"translateX(-50%)",
        background:"var(--bg-card)", color:"var(--text-hi)", padding:"10px 18px",
        border:"1px solid var(--border-hair-strong)",
        borderRadius:"10px", fontSize:"13px", boxShadow:"0 12px 32px rgba(0,0,0,0.5)",
        zIndex:"999", fontFamily:"var(--ui)"
      });
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.opacity = "1";
    clearTimeout(window.__toastT);
    window.__toastT = setTimeout(()=>{ el.style.opacity = "0"; }, 1800);
  }

  const id = getParam("id") || "m2";
  const mod = getModule(id);

  (async function init(){
    const currentIdentity = await ensureIdentity();
    await initProgress(currentIdentity);

    if(!mod){
      document.getElementById("pageTitle").textContent = "Module not found";
      return;
    }

    document.getElementById("pageTitle").textContent = mod.name;
    const pill = document.getElementById("badgePill");
    pill.textContent = mod.badge;
    pill.classList.add(mod.badgeColor);

    // Progress bar for the Module group this topic belongs to (e.g. all
    // topics under "Module 1 — Introduction & Communications").
    const groupTopics = getModulesWithProgress().filter(t => t.groupId === mod.groupId);
    const groupDone = groupTopics.filter(t => t.covered).length;
    const groupTotal = groupTopics.length;
    const groupPct = groupTotal ? Math.round((groupDone / groupTotal) * 100) : 0;
    document.getElementById("moduleProgressBlock").style.display = "block";
    document.getElementById("moduleProgressLabel").textContent =
      `${mod.groupLabel} — ${groupDone}/${groupTotal} topics`;
    document.getElementById("moduleProgressPct").textContent = `${groupPct}%`;
    document.getElementById("moduleProgressFill").style.width = groupPct + "%";

    const markBtn = document.getElementById("markDoneBtn");
    let done = getModuleProgress(mod.id).covered;
    function refreshMarkBtn(){
      markBtn.textContent = done ? "✓ Done" : "Mark as done";
    }
    refreshMarkBtn();
    function refreshGroupProgressBar(){
      const gt = getModulesWithProgress().filter(t => t.groupId === mod.groupId);
      const gd = gt.filter(t => t.covered).length;
      const gp = gt.length ? Math.round((gd / gt.length) * 100) : 0;
      document.getElementById("moduleProgressLabel").textContent = `${mod.groupLabel} — ${gd}/${gt.length} topics`;
      document.getElementById("moduleProgressPct").textContent = `${gp}%`;
      document.getElementById("moduleProgressFill").style.width = gp + "%";
    }

    markBtn.addEventListener("click", ()=>{
      done = !done;
      setModuleCovered(mod.id, done, currentIdentity);
      refreshMarkBtn();
      refreshGroupProgressBar();
      toast(done ? `${mod.name} marked as done.` : `${mod.name} marked as not done.`);
    });

    // Each guide/quiz/tool card gets its OWN independent pin button — pinning
    // one item doesn't affect the others, and each is tracked individually
    // in progress.js's pinnedItems store.
    function pinButton(type, title, extra){
      let itemPinned = isItemPinned(mod.id, type, title);
      const b = document.createElement("button");
      b.className = "pin-btn" + (itemPinned ? " active" : "");
      b.textContent = "📌";
      b.title = itemPinned ? "Unpin this item" : "Pin for review";
      b.addEventListener("click", (e)=>{
        e.preventDefault();
        itemPinned = !itemPinned;
        setItemPinned(mod.id, type, title, itemPinned, currentIdentity,
          Object.assign({ topicName: mod.name }, extra || {}));
        b.classList.toggle("active", itemPinned);
        b.title = itemPinned ? "Unpin this item" : "Pin for review";
        toast(itemPinned ? `${title} pinned for review.` : `${title} unpinned.`);
      });
      return b;
    }

    const guidesGrid = document.getElementById("guidesGrid");
    (mod.guides || []).forEach(g=>{
      const card = document.createElement("div");
      card.className = "content-card guide";
      card.appendChild(pinButton("guide", g.title, { file: g.file }));
      const subtitle = g.subtitle ? `<span class="card-subtitle">${g.subtitle}</span>` : "";
      const linkAttrs = g.file
        ? `href="${g.file}" target="_blank" rel="noopener"`
        : `href="#" onclick="toast('Opening ${g.title}…');return false;"`;
      card.insertAdjacentHTML("beforeend", `
        <span class="card-icon">📘</span>
        <h3 class="card-title">${g.title}</h3>
        ${subtitle}
        <a class="card-action guide-action" ${linkAttrs}>Open PDF →</a>
      `);
      guidesGrid.appendChild(card);
    });
    if(!mod.guides || mod.guides.length===0) document.getElementById("guidesSection").style.display = "none";

    const quizzesGrid = document.getElementById("quizzesGrid");
    (mod.quizzes || []).forEach(q=>{
      const card = document.createElement("div");
      card.className = "content-card quiz";
      card.appendChild(pinButton("quiz", q.title, { link: q.link }));
      const bullets = (q.bullets||[]).map(b=>`<li>${b}</li>`).join("");
      const history = getQuizHistory(q.title);
      const best = getQuizBest(q.title);
      const historyLine = history.length
        ? `<span class="card-subtitle">Best: ${best.score}/${best.total} · ${history.length} attempt${history.length===1?"":"s"} so far</span>`
        : "";
      const quizLinkAttrs = q.link
        ? `href="${q.link}"`
        : `href="#" onclick="toast('Starting ${q.title}…');return false;"`;
      card.insertAdjacentHTML("beforeend", `
        <span class="card-icon">📝</span>
        <h3 class="card-title">${q.title}</h3>
        <ul class="card-bullets">${bullets}</ul>
        ${historyLine}
        <a class="card-action quiz-action" ${quizLinkAttrs}>Start quiz →</a>
      `);
      quizzesGrid.appendChild(card);
    });
    if(!mod.quizzes || mod.quizzes.length===0) document.getElementById("quizzesSection").style.display = "none";

    if(mod.tools && mod.tools.length){
      document.getElementById("toolsSection").style.display = "block";
      const toolsGrid = document.getElementById("toolsGrid");
      mod.tools.forEach(t=>{
        const card = document.createElement("div");
        card.className = "content-card tool";
        card.appendChild(pinButton("tool", t.title, {}));
        card.insertAdjacentHTML("beforeend", `
          <span class="card-icon">⚙️</span>
          <h3 class="card-title">${t.title}</h3>
          <a class="card-action tool-action" href="#" onclick="toast('Opening ${t.title}…');return false;">Open →</a>
        `);
        toolsGrid.appendChild(card);
      });
    }
  })();
</script>

</body>
</html>
