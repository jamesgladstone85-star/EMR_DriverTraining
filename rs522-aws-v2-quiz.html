<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS522 AWS Quiz — Driver Training</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<style>
  body{background:var(--bg-void);}

  .quiz-wrap{max-width:880px;margin:0 auto;padding:36px 20px 70px;}

  /* ---- Menu screen ---- */
  .quiz-intro{margin-bottom:28px;}
  .quiz-intro h1{font-size:clamp(22px,3vw,30px);margin:6px 0 8px;color:var(--text-hi);}
  .quiz-intro p{color:var(--text-mid);font-size:13.5px;font-weight:300;max-width:560px;line-height:1.6;margin:0;}

  .section-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:1px;
    background:var(--border-hair);
    border:1px solid var(--border-hair);
    border-radius:var(--radius-md);
    overflow:hidden;
    margin-top:22px;
  }
  .section-card{
    background:var(--bg-card);
    padding:20px;
    display:flex;
    flex-direction:column;
    gap:8px;
    cursor:pointer;
    border-top:2px solid var(--accent-green);
    transition:background .15s ease;
    text-align:left;
    font-family:inherit;
    color:inherit;
    border-left:none;border-right:none;border-bottom:none;
  }
  .section-card:hover{background:var(--bg-card-hover);}
  .section-card.full{border-top-color:var(--accent-amber);}
  .section-card .s-title{font-family:var(--ui);font-size:14.5px;font-weight:600;color:var(--text-hi);margin:0;}
  .section-card .s-desc{font-size:12px;color:var(--text-mid);font-weight:300;line-height:1.55;margin:0;flex:1;}
  .section-card .s-meta{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);letter-spacing:0.04em;}
  .section-card .s-best{font-family:var(--mono);font-size:10.5px;color:var(--accent-green);}

  /* ---- Quiz screen ---- */
  .quiz-header{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--bg-panel);border:1px solid var(--border-hair);
    border-radius:var(--radius-md);padding:16px 20px;margin-bottom:20px;gap:16px;flex-wrap:wrap;
  }
  .quiz-header .q-count{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);}
  .progress-track{
    width:100%;height:5px;border-radius:6px;background:var(--bg-card);
    overflow:hidden;margin-top:20px;
  }
  .progress-fill{height:100%;background:var(--accent-green);transition:width .25s ease;}

  .q-card{
    background:var(--bg-card);border:1px solid var(--border-hair);
    border-radius:var(--radius-md);padding:26px 24px;margin-bottom:20px;
  }
  .q-text{font-family:var(--display);font-weight:700;font-size:18px;color:var(--text-hi);margin:0 0 20px;line-height:1.4;}
  .opt-list{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{
    text-align:left;
    background:var(--bg-panel);
    border:1px solid var(--border-hair-strong);
    border-radius:10px;
    padding:13px 16px;
    color:var(--text-hi);
    font-family:var(--ui);font-size:13.5px;font-weight:400;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .opt-btn:hover{border-color:var(--accent-purple);background:var(--bg-card-hover);}
  .opt-btn.selected{border-color:var(--accent-purple);background:rgba(199,125,255,0.1);font-weight:600;}

  .quiz-nav{display:flex;justify-content:space-between;gap:12px;}

  /* ---- Results screen ---- */
  .result-card{
    background:var(--bg-panel);border:1px solid var(--border-hair);
    border-radius:var(--radius-md);padding:40px 30px;text-align:center;max-width:460px;margin:40px auto 0;
  }
  .result-badge{
    width:74px;height:74px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 18px;font-size:30px;
  }
  .result-badge.pass{background:rgba(62,214,160,0.14);color:var(--accent-green);}
  .result-badge.fail{background:rgba(255,93,143,0.14);color:var(--accent-red);}
  .result-card h2{font-size:22px;margin:0 0 6px;color:var(--text-hi);}
  .result-score{color:var(--text-mid);font-size:13.5px;margin:0 0 22px;}
  .result-score b{color:var(--text-hi);}
  .pass-gate-box{
    background:var(--bg-card);border:1px solid var(--border-hair);border-radius:12px;
    padding:16px 18px;margin-bottom:26px;text-align:left;font-size:12px;color:var(--text-mid);line-height:1.7;
  }
  .pass-gate-box b{color:var(--text-hi);}

  /* ---- Review screen ---- */
  .review-item{
    background:var(--bg-card);border-radius:var(--radius-md);
    border-left:4px solid var(--accent-red);margin-bottom:14px;overflow:hidden;
  }
  .review-item.correct{border-left-color:var(--accent-green);}
  .review-item-body{padding:20px;}
  .review-q-row{display:flex;justify-content:space-between;gap:14px;margin-bottom:14px;align-items:flex-start;}
  .review-q-row h3{font-size:14.5px;font-weight:600;color:var(--text-hi);margin:0;line-height:1.5;flex:1;}
  .status-pill{
    font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;
    padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;
  }
  .status-pill.correct{background:rgba(62,214,160,0.14);color:var(--accent-green);}
  .status-pill.incorrect{background:rgba(255,93,143,0.14);color:var(--accent-red);}
  .review-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:14px;}
  .review-opt{
    padding:9px 12px;border-radius:8px;border:1px solid var(--border-hair);
    background:var(--bg-panel);color:var(--text-dim);font-size:12px;display:flex;align-items:center;gap:8px;
  }
  .review-opt.correct-opt{border-color:rgba(62,214,160,0.4);background:rgba(62,214,160,0.08);color:var(--text-hi);font-weight:500;}
  .review-opt.wrong-pick{border-color:rgba(255,93,143,0.4);background:rgba(255,93,143,0.08);color:var(--accent-red);}
  .rationale-box{
    background:var(--bg-void);border:1px solid var(--border-hair);border-radius:10px;
    padding:12px 14px;font-size:11.5px;color:var(--accent-amber);line-height:1.6;
  }
  .rationale-box b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;}

  .footer-note{text-align:center;color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:30px 24px 44px;}
</style>
</head>
<body>

<div class="module-header">
  <div class="left">
    <a class="btn btn-outline-white" href="module.html?id=aws-tpws">← Back</a>
    <div class="title-block">
      <span class="badge-pill green">QUIZ</span>
      <h1 id="pageTitle">RS522 AWS Quiz</h1>
    </div>
  </div>
</div>
<div class="rail-strip"></div>

<div class="quiz-wrap" id="app"></div>

<div class="footer-note">All content sourced from RS522 Issue 3 (AWS and TPWS Handbook, December 2015)</div>

<script src="assets/team.js"></script>
<script src="assets/identity.js"></script>
<script src="assets/progress.js"></script>
<script src="assets/rs522-v2-quiz-data.js"></script>
<script src="assets/quiz-engine.js"></script>
<script>
  QuizEngine.init({
    appEl: document.getElementById("app"),
    title: "RS522 AWS Quiz",
    introHtml: `<p>${RS522V2_QUIZ_QUESTIONS.length} questions, straight from RS522 Issue 3. Write your own
        answer, reveal the model answer, then mark yourself honestly — there's real value in the self-assessment,
        so take it seriously. Pass mark is 75%. Every attempt is saved to your progress history.</p>`,
    questions: RS522V2_QUIZ_QUESTIONS,
    sections: RS522V2_QUIZ_SECTIONS,
    linkedTopicId: "aws-tpws",
    passPct: 0.75,
    modularCredit: false,
    randomExamSize: 10,
  });
</script>

</body>
</html>
